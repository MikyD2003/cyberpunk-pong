<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyberpunk Pong</title>
  <style>
    :root {
      --bg1: #070b1a;
      --bg2: #120d24;
      --cyan: #00f5ff;
      --pink: #ff2bd6;
      --purple: #8a5cff;
      --lime: #b7ff4a;
      --text: #e8f7ff;
      --glass: rgba(10, 14, 30, 0.7);
      --grid: rgba(0, 245, 255, 0.18);
      --shadow-cyan: 0 0 12px rgba(0, 245, 255, 0.7);
      --shadow-pink: 0 0 12px rgba(255, 43, 214, 0.7);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      background:
        radial-gradient(circle at top, rgba(138, 92, 255, 0.2), transparent 35%),
        linear-gradient(180deg, var(--bg2), var(--bg1));
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    .game-shell {
      position: relative;
      width: min(92vw, 1000px);
      height: min(76vh, 620px);
      background: rgba(7, 11, 26, 0.78);
      border: 2px solid rgba(0, 245, 255, 0.5);
      box-shadow:
        0 0 25px rgba(0, 245, 255, 0.2),
        inset 0 0 20px rgba(255, 43, 214, 0.08);
      border-radius: 18px;
      overflow: hidden;
    }

    .game-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 30px 30px;
      mask-image: radial-gradient(circle at center, black 55%, transparent 100%);
      pointer-events: none;
    }

    .hud {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-shadow: var(--shadow-cyan);
    }

    .score {
      font-size: clamp(1.5rem, 3vw, 3rem);
      color: var(--text);
      min-width: 110px;
      text-align: center;
    }

    .score.left {
      color: var(--cyan);
      text-shadow: var(--shadow-cyan);
    }

    .score.right {
      color: var(--pink);
      text-shadow: var(--shadow-pink);
    }

    .divider {
      width: 2px;
      height: 44px;
      background: linear-gradient(180deg, transparent, var(--cyan), var(--pink), transparent);
      box-shadow: var(--shadow-cyan), var(--shadow-pink);
      opacity: 0.85;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: rgba(7, 11, 26, 0.2);
      z-index: 1;
      cursor: none;
    }

    .message {
      position: absolute;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      z-index: 12;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(232, 247, 255, 0.8);
      background: rgba(10, 14, 30, 0.45);
      border: 1px solid rgba(0, 245, 255, 0.3);
      padding: 10px 16px;
      border-radius: 999px;
      box-shadow: var(--shadow-cyan);
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="hud">
      <div class="score left" id="scoreLeft">0</div>
      <div class="divider"></div>
      <div class="score right" id="scoreRight">0</div>
    </div>

    <canvas id="gameCanvas" width="1000" height="620"></canvas>

    <div class="message">Mouse + ↑ ↓ / Move to play</div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreLeftEl = document.getElementById("scoreLeft");
    const scoreRightEl = document.getElementById("scoreRight");

    const game = {
      width: canvas.width,
      height: canvas.height,
      lastTime: 0,
      keys: { up: false, down: false },
      mouseY: canvas.height / 2
    };

    const paddleWidth = 18;
    const paddleHeight = 120;
    const paddleSpeed = 560;
    const ballRadius = 12;

    const leftPaddle = {
      x: 36,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: paddleSpeed,
      color: "#00f5ff"
    };

    const rightPaddle = {
      x: canvas.width - 36 - paddleWidth,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: 430,
      color: "#ff2bd6"
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: ballRadius,
      vx: 360,
      vy: 180,
      speed: 440,
      color: "#b7ff4a"
    };

    const score = {
      left: 0,
      right: 0
    };

    function resetBall(direction = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      const angle = (Math.random() * Math.PI / 2.2) - Math.PI / 4.4;
      const speed = ball.speed;
      ball.vx = Math.cos(angle) * speed * direction;
      ball.vy = Math.sin(angle) * speed;
    }

    function setMousePaddleFromPointer(event) {
      const rect = canvas.getBoundingClientRect();
      const mouseY = ((event.clientY - rect.top) / rect.height) * canvas.height;
      game.mouseY = mouseY;
    }

    function updatePaddles(delta) {
      const moveLeft = (game.keys.up ? -1 : 0) + (game.keys.down ? 1 : 0);

      if (moveLeft !== 0) {
        leftPaddle.y += moveLeft * leftPaddle.speed * delta;
      } else {
        const targetY = game.mouseY - leftPaddle.height / 2;
        const diff = targetY - leftPaddle.y;
        const smoothing = 0.18;
        leftPaddle.y += diff * smoothing;
      }

      leftPaddle.y = clamp(leftPaddle.y, 0, canvas.height - leftPaddle.height);

      const rightCenter = rightPaddle.y + rightPaddle.height / 2;
      const ballCenter = ball.y;
      const targetOffset = ballCenter - rightCenter;
      const followFactor = 0.1 + Math.min(Math.abs(ball.vx) / 900, 0.12);
      rightPaddle.y += targetOffset * followFactor * 0.9;

      rightPaddle.y = clamp(rightPaddle.y, 0, canvas.height - rightPaddle.height);
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function collidesWithPaddle(paddle, b) {
      const closestX = clamp(b.x, paddle.x, paddle.x + paddle.width);
      const closestY = clamp(b.y, paddle.y, paddle.y + paddle.height);
      const dx = b.x - closestX;
      const dy = b.y - closestY;
      return (dx * dx + dy * dy) <= (b.radius * b.radius);
    }

    function updateBall(delta) {
      ball.x += ball.vx * delta;
      ball.y += ball.vy * delta;

      if (ball.y - ball.radius <= 0) {
        ball.y = ball.radius;
        ball.vy *= -1;
      }

      if (ball.y + ball.radius >= canvas.height) {
        ball.y = canvas.height - ball.radius;
        ball.vy *= -1;
      }

      if (ball.x - ball.radius <= leftPaddle.x + leftPaddle.width &&
          ball.x + ball.radius >= leftPaddle.x &&
          ball.y >= leftPaddle.y &&
          ball.y <= leftPaddle.y + leftPaddle.height) {
        const relativeIntersectY = (ball.y - (leftPaddle.y + leftPaddle.height / 2)) / (leftPaddle.height / 2);
        const bounceAngle = relativeIntersectY * (Math.PI / 3);
        const speed = Math.hypot(ball.vx, ball.vy) * 1.06;
        ball.vx = Math.abs(Math.cos(bounceAngle)) * speed;
        ball.vy = Math.sin(bounceAngle) * speed;
        ball.x = leftPaddle.x + leftPaddle.width + ball.radius + 1;
      }

      if (ball.x + ball.radius >= rightPaddle.x &&
          ball.x - ball.radius <= rightPaddle.x + rightPaddle.width &&
          ball.y >= rightPaddle.y &&
          ball.y <= rightPaddle.y + rightPaddle.height) {
        const relativeIntersectY = (ball.y - (rightPaddle.y + rightPaddle.height / 2)) / (rightPaddle.height / 2);
        const bounceAngle = relativeIntersectY * (Math.PI / 3);
        const speed = Math.hypot(ball.vx, ball.vy) * 1.06;
        ball.vx = -Math.abs(Math.cos(bounceAngle)) * speed;
        ball.vy = Math.sin(bounceAngle) * speed;
        ball.x = rightPaddle.x - ball.radius - 1;
      }

      if (ball.x < 0) {
        score.right += 1;
        scoreRightEl.textContent = score.right;
        resetBall(1);
      }

      if (ball.x > canvas.width) {
        score.left += 1;
        scoreLeftEl.textContent = score.left;
        resetBall(-1);
      }
    }

    function drawRoundedRect(x, y, w, h, r, color) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }

    function drawCenterLine() {
      ctx.strokeStyle = "rgba(0, 245, 255, 0.6)";
      ctx.lineWidth = 3;
      ctx.setLineDash([18, 14]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = ball.color;
      ctx.shadowColor = "#b7ff4a";
      ctx.shadowBlur = 20;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function drawPaddles() {
      drawRoundedRect(leftPaddle.x, leftPaddle.y, leftPaddle.width, leftPaddle.height, 12, leftPaddle.color);
      drawRoundedRect(rightPaddle.x, rightPaddle.y, rightPaddle.width, rightPaddle.height, 12, rightPaddle.color);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Background glow
      const glow = ctx.createRadialGradient(
        canvas.width / 2,
        canvas.height / 2,
        40,
        canvas.width / 2,
        canvas.height / 2,
        canvas.width * 0.8
      );
      glow.addColorStop(0, "rgba(0,245,255,0.10)");
      glow.addColorStop(1, "rgba(255,43,214,0.04)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawCenterLine();
      drawPaddles();
      drawBall();
    }

    function gameLoop(timestamp) {
      const delta = Math.min((timestamp - game.lastTime) / 1000 || 0.016, 0.024);
      game.lastTime = timestamp;

      updatePaddles(delta);
      updateBall(delta);
      draw();

      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowUp" || event.key.toLowerCase() === "w") {
        game.keys.up = true;
      }
      if (event.key === "ArrowDown" || event.key.toLowerCase() === "s") {
        game.keys.down = true;
      }
    });

    document.addEventListener("keyup", (event) => {
      if (event.key === "ArrowUp" || event.key.toLowerCase() === "w") {
        game.keys.up = false;
      }
      if (event.key === "ArrowDown" || event.key.toLowerCase() === "s") {
        game.keys.down = false;
      }
    });

    canvas.addEventListener("mousemove", setMousePaddleFromPointer);
    canvas.addEventListener("touchmove", (event) => {
      const touch = event.touches[0];
      if (touch) setMousePaddleFromPointer(touch);
    }, { passive: true });

    scoreLeftEl.textContent = score.left;
    scoreRightEl.textContent = score.right;
    resetBall(1);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
